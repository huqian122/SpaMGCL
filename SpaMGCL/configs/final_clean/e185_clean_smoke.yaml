experiment:
  name: e185_clean_smoke
  phase: P1
  dataset: E18.5
  seed: 0
  epochs: 50
  warm_up_epochs: 10

data:
  # Change only this config value when running in Colab.
  root: /kaggle/input/datasets/wuvdji/smgc-data/
  label_key: Combined_Clusters
  spatial_key: spatial
  spatial_row_key: array_row
  spatial_col_key: array_col
  matrix_source: X
  n_pca_components: 100

preprocessing:
  log1p: false
  standardize: false

graphs:
  spatial:
    k: 3
    include_self: false
    symmetrize: true
  feature:
    k: 20
    symmetrize: true
    clip_negative: true

model:
  gcn_hidden_dim: 32
  fine_dim: 128
  coarse_dim: 16
  representation_dim: 16
  fusion_hidden_dim: 64
  num_clusters: 14
  alpha: 0.5
  tau_s: 0.3
  cluster_temperature: 0.3
  cluster_regularization_weight: 1.0

training:
  epochs: 50
  warm_up_epochs: 10
  lr: 0.001
  weight_decay: 0.00001
  cluster_head_lr_multiplier: 8.0
  # First measure MGCMVC structure without mixing in spatial smoothness.
  cluster_head_init: none
  spatial_start_epoch: 999

spatial:
  # Pure MGCMVC-core baseline: retain spatial GCN views, disable SpaMGCL additions.
  enabled: false
  consistency_weighting: false
  negative_filter: false

loss:
  lambda_rec: 1.0
  lambda_mgcl: 3.0
  lambda_cluster: 0.1
  lambda_spatial: 0.0

clustering:
  method: kmeans
  embedding: concat_z
  n_clusters: 14

evaluation:
  nmi_average_method: max

output:
  root: results_clean
