experiment:
  name: diagnostic_hlna1_fine16
  phase: DIAG_REPRESENTATION_CAPACITY
  dataset: HLN-A1
  seed: 0
  epochs: 50
  warm_up_epochs: 10

data:
  root: /Users/qianhu/博士论文/多角度聚类医学论文/SpaMGCL/Expert Systems SMGC/SMGC-data
  label_key: Spatial_Label
  spatial_key: spatial
  spatial_row_key: array_row
  spatial_col_key: array_col
  matrix_source: X
  n_pca_components: 100

preprocessing:
  log1p: false
  standardize: false

graphs:
  spatial:
    k: 3
    include_self: false
    symmetrize: true
  feature:
    k: 20
    symmetrize: true
    clip_negative: true

model:
  gcn_hidden_dim: 32
  fine_dim: 16
  coarse_dim: 16
  representation_dim: 16
  fusion_hidden_dim: 64
  num_clusters: 10
  alpha: 0.5
  tau_s: 0.3
  cluster_temperature: 1.0
  cluster_regularization_weight: 1.0

training:
  epochs: 50
  warm_up_epochs: 10
  lr: 0.001
  weight_decay: 0.00001
  cluster_head_lr_multiplier: 8.0
  cluster_head_init: none
  spatial_start_epoch: 51

spatial:
  enabled: false
  consistency_weighting: false
  negative_filter: false

loss:
  lambda_rec: 1.0
  lambda_mgcl: 1.0
  lambda_cluster: 5.0
  lambda_spatial: 0.1

clustering:
  method: argmax
  embedding: cluster_probabilities
  n_clusters: 10

output:
  root: results/diagnostic_hlna1_fine16
